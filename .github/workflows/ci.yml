name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o secret-proof ./cmd/secret-proof
      - name: Sample outputs are up to date
        run: |
          ./secret-proof demo > /tmp/o.txt; diff /tmp/o.txt docs/sample-output.txt
          ./secret-proof demo --html > /tmp/o.html; diff /tmp/o.html site/index.html
          test "$(./secret-proof demo --fail-on confirmed >/dev/null; echo $?)" = "1" || true
