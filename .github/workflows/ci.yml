name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o secret-proof ./cmd/secret-proof
      - name: Sample outputs are up to date
        run: |
          ./secret-proof demo > /tmp/o.txt; diff /tmp/o.txt docs/sample-output.txt
          ./secret-proof demo --html > /tmp/o.html; diff /tmp/o.html site/index.html
          test "$(./secret-proof demo --fail-on confirmed >/dev/null; echo $?)" = "1" || true
